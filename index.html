<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Online</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #111;
      background: #f4f4f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(100%, 420px);
      display: grid;
      gap: 16px;
      padding: 24px;
    }

    h1,
    p {
      margin: 0;
    }

    .panel {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 2px solid #111;
      background: #fff;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input,
    button {
      font: inherit;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #111;
    }

    button {
      padding: 10px 16px;
      border: 2px solid #111;
      background: #fff;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cell {
      aspect-ratio: 1;
      border: 2px solid #111;
      background: #fff;
      font-size: 2rem;
    }

    .hint {
      color: #444;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tic-Tac-Toe Online</h1>

    <section class="panel" aria-label="Room controls">
      <p id="status">Add your Firebase config, then create or join a room.</p>
      <p id="identity" class="hint">You are not in a room yet.</p>
      <div class="row">
        <button id="create-room">Create room</button>
      </div>
      <div class="row">
        <input id="room-input" type="text" maxlength="6" placeholder="Room code">
        <button id="join-room">Join room</button>
      </div>
      <p id="room-code" class="hint">Room: none</p>
      <p class="hint">Reason: two-device play needs one shared source of truth. This page renders the board, but the room data is the real game state.</p>
    </section>

    <section class="board" aria-label="Tic-Tac-Toe board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </section>

    <div class="row">
      <button id="reset">Restart room</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      onValue,
      ref,
      runTransaction,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFFT54F_L_apicpvT9zLDWsevy3QehI80",
      authDomain: "tic-tac-toe-online-3401c.firebaseapp.com",
      databaseURL: "https://tic-tac-toe-online-3401c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tic-tac-toe-online-3401c",
      storageBucket: "tic-tac-toe-online-3401c.firebasestorage.app",
      messagingSenderId: "217819059486",
      appId: "1:217819059486:web:3b3bd31cc6bfda78f1250f",
    };

    const wins = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    const status = document.getElementById("status");
    const identity = document.getElementById("identity");
    const roomCodeText = document.getElementById("room-code");
    const roomInput = document.getElementById("room-input");
    const createRoomButton = document.getElementById("create-room");
    const joinRoomButton = document.getElementById("join-room");
    const resetButton = document.getElementById("reset");
    const cells = Array.from(document.querySelectorAll(".cell"));

    const missingConfig = Object.values(firebaseConfig).some((value) => value === "REPLACE_ME");
    const playerId = crypto.randomUUID();

    let database = null;
    let unsubscribeRoom = null;
    let currentRoomCode = "";
    let currentSymbol = "";
    let currentState = null;

    function createEmptyState() {
      return {
        board: Array(9).fill(""),
        currentPlayer: "X",
        players: {
          X: "",
          O: ""
        },
        winner: "",
        status: "waiting"
      };
    }

    function updateStatus(message) {
      status.textContent = message;
    }

    function winningLine(board) {
      return wins.find(([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]);
    }

    function roomRef(roomCode) {
      return ref(database, `rooms/${roomCode}`);
    }

    function randomRoomCode() {
      return Math.random().toString(36).slice(2, 8).toUpperCase();
    }

    function renderRoom(state) {
      currentState = state;

      cells.forEach((cell, index) => {
        const value = state?.board?.[index] || "";
        cell.textContent = value;
        cell.disabled = !state || !canPlayCell(index, state);
      });

      roomCodeText.textContent = currentRoomCode ? `Room: ${currentRoomCode}` : "Room: none";
      identity.textContent = currentSymbol
        ? `You are player ${currentSymbol}. Share room code ${currentRoomCode}.`
        : "You are a spectator or not assigned yet.";

      if (!state) {
        updateStatus("Create or join a room.");
        return;
      }

      if (state.status === "waiting") {
        updateStatus("Waiting for a second player.");
        return;
      }

      if (state.status === "won") {
        updateStatus(`Player ${state.winner} wins.`);
        return;
      }

      if (state.status === "draw") {
        updateStatus("Draw.");
        return;
      }

      if (state.currentPlayer === currentSymbol) {
        updateStatus(`Your turn as ${currentSymbol}.`);
        return;
      }

      updateStatus(`Waiting for player ${state.currentPlayer}.`);
    }

    function canPlayCell(index, state) {
      return Boolean(
        currentSymbol &&
        state.status === "playing" &&
        state.currentPlayer === currentSymbol &&
        !state.board[index]
      );
    }

    function attachRoom(roomCode) {
      if (unsubscribeRoom) {
        unsubscribeRoom();
      }

      currentRoomCode = roomCode;
      unsubscribeRoom = onValue(roomRef(roomCode), (snapshot) => {
        renderRoom(snapshot.val());
      });
    }

    async function createRoom() {
      const roomCode = randomRoomCode();
      const nextState = createEmptyState();
      nextState.players.X = playerId;
      await set(roomRef(roomCode), nextState);
      currentSymbol = "X";
      attachRoom(roomCode);
    }

    async function joinRoom() {
      const roomCode = roomInput.value.trim().toUpperCase();

      if (!roomCode) {
        updateStatus("Enter a room code first.");
        return;
      }

      const result = await runTransaction(roomRef(roomCode), (state) => {
        if (!state) {
          return;
        }

        if (!state.players.X) {
          state.players.X = playerId;
        } else if (!state.players.O) {
          state.players.O = playerId;
        } else if (state.players.X !== playerId && state.players.O !== playerId) {
          return;
        }

        if (state.players.X && state.players.O && state.status === "waiting") {
          state.status = "playing";
        }

        return state;
      });

      if (!result.committed || !result.snapshot.exists()) {
        updateStatus("Room not found.");
        return;
      }

      const state = result.snapshot.val();
      currentSymbol = state.players.X === playerId ? "X" : state.players.O === playerId ? "O" : "";
      attachRoom(roomCode);
    }

    async function playMove(index) {
      if (!currentRoomCode) {
        updateStatus("Create or join a room first.");
        return;
      }

      await runTransaction(roomRef(currentRoomCode), (state) => {
        if (!state) {
          return;
        }

        if (
          state.status !== "playing" ||
          state.currentPlayer !== currentSymbol ||
          state.board[index]
        ) {
          return state;
        }

        state.board[index] = currentSymbol;

        if (winningLine(state.board)) {
          state.status = "won";
          state.winner = currentSymbol;
          return state;
        }

        if (state.board.every(Boolean)) {
          state.status = "draw";
          return state;
        }

        state.currentPlayer = currentSymbol === "X" ? "O" : "X";
        return state;
      });
    }

    async function restartRoom() {
      if (!currentRoomCode) {
        updateStatus("Create or join a room first.");
        return;
      }

      await runTransaction(roomRef(currentRoomCode), (state) => {
        if (!state) {
          return;
        }

        state.board = Array(9).fill("");
        state.currentPlayer = "X";
        state.winner = "";
        state.status = state.players.X && state.players.O ? "playing" : "waiting";
        return state;
      });
    }

    if (missingConfig) {
      updateStatus("Add your Firebase config in this file before online play will work.");
      createRoomButton.disabled = true;
      joinRoomButton.disabled = true;
      resetButton.disabled = true;
      cells.forEach((cell) => {
        cell.disabled = true;
      });
    } else {
      const app = initializeApp(firebaseConfig);
      database = getDatabase(app);
    }

    createRoomButton.addEventListener("click", createRoom);
    joinRoomButton.addEventListener("click", joinRoom);
    resetButton.addEventListener("click", restartRoom);
    cells.forEach((cell) => {
      cell.addEventListener("click", () => {
        playMove(Number(cell.dataset.index));
      });
    });
  </script>
</body>
</html>
